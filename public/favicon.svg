<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark: what you borrowed (the indigo disc) and the interest you pay
       on top (the lavender crescent behind it). Same as src/Icons.jsx. -->
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d6ff5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <mask id="gap">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="13.5" cy="16" r="12.6" fill="#000"/>
    </mask>
  </defs>
  <circle cx="19.5" cy="16" r="11" fill="#a5b4fc" mask="url(#gap)"/>
  <circle cx="13.5" cy="16" r="11" fill="url(#front)"/>
</svg>
